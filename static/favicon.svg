<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242b3d"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96bfa5"/>
      <stop offset="100%" stop-color="#60846e"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#d6ccbe"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#07080c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3a4258" stroke-width="1.5"/>

  <!-- Book Pages Stack (Shadow / lower layers) -->
  <path d="M12 43 C 20 42, 28 44, 32 46 C 36 44, 44 42, 52 43 L 52 45 C 44 44, 36 46, 32 48 C 28 46, 20 44, 12 45 Z" 
        fill="#7a7e8e" opacity="0.6"/>

  <!-- Book Cover Base / Trim -->
  <path d="M12 41 C 21 39.5, 28 42, 32 44.5 C 36 42, 43 39.5, 52 41 L 52 42.5 C 43 41, 36 43.5, 32 46 C 28 43.5, 21 41, 12 42.5 Z" 
        fill="#4e6b58"/>

  <!-- Left Page (Open Tome) -->
  <path d="M 32 23 C 27 20.5, 19 20, 13 22 C 12.4 22.2, 12 22.8, 12 23.5 L 12 39.5 C 12 40.2, 12.5 40.7, 13.2 40.5 C 19 38.8, 27 39.2, 32 42 Z" 
        fill="url(#pageGrad)" filter="url(#subtleShadow)"/>

  <!-- Right Page (Open Tome) -->
  <path d="M 32 23 C 37 20.5, 45 20, 51 22 C 51.6 22.2, 52 22.8, 52 23.5 L 52 39.5 C 52 40.2, 51.5 40.7, 50.8 40.5 C 45 38.8, 37 39.2, 32 42 Z" 
        fill="url(#pageGrad)" filter="url(#subtleShadow)"/>

  <!-- Text Line Accents on Pages (Subtle Literary Detail) -->
  <!-- Left Page Lines -->
  <path d="M 17 26.5 C 21 25.8, 26 26.2, 28.5 27.5" stroke="#9e9587" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 16.5 30.5 C 21 29.8, 26 30.2, 28.5 31.5" stroke="#9e9587" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 17 34.5 C 20.5 33.8, 25 34.2, 27 35.2" stroke="#9e9587" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right Page Lines -->
  <path d="M 35.5 27.5 C 38 26.2, 43 25.8, 47 26.5" stroke="#9e9587" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 35.5 31.5 C 38 30.2, 43 29.8, 47.5 30.5" stroke="#9e9587" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 37 35.2 C 39 34.2, 43.5 33.8, 47 34.5" stroke="#9e9587" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Spine Center Line -->
  <line x1="32" y1="23" x2="32" y2="42" stroke="#b0a799" stroke-width="1"/>

  <!-- Elegant Quill Pen sweeping from top right across center -->
  <g transform="rotate(-18 36 24)" filter="url(#subtleShadow)">
    <!-- Feather Vane -->
    <path d="M 36 6 C 39 10, 41 16, 38 24 C 36.8 21, 35 18, 33 16 C 34.5 12, 35.2 8, 36 6 Z" 
          fill="url(#sageGrad)"/>
    <path d="M 36 6 C 34 11, 32 17, 34 25 C 35 22, 36 19, 36.5 16 C 36 12, 35.8 8, 36 6 Z" 
          fill="#5b806a"/>
    <!-- Feather Shaft / Quill Nib -->
    <path d="M 36 6 L 36 29 L 35 32 L 36.8 32 L 36 29 Z" fill="#e8e0d4"/>
    <!-- Gold / Brass Nib Tip -->
    <polygon points="35,31 37,31 36,33.5" fill="#d4af37"/>
  </g>

  <!-- Sparkle / Magic Novel Star (top left) -->
  <path d="M 17 12 Q 17 14.5, 14.5 14.5 Q 17 14.5, 17 17 Q 17 14.5, 19.5 14.5 Q 17 14.5, 17 12 Z" fill="#7a9e87" opacity="0.85"/>
  <circle cx="23" cy="11" r="0.9" fill="#7a9e87" opacity="0.6"/>
</svg>
